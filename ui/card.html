<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Magpie</title>
<!--
  这层壳为什么存在（2026-10-08）：

  Hana 的卡片分两种。route 型的文档由 Hana 自己的 app-host 伺服，宿主与文档之间的
  「可信握手」瞬间完成，卡片秒开（图库、token-tracker 就是这样）。service 型的
  文档来自 App 自己的服务（我们原来是这种），而那个握手只认 Hana 自己签发的文档：
  宿主发 chrome-challenge、等文档回话，magpie 的页面当然不会回，于是**每次打开都要
  等超时才放行**——实测 5 秒左右，页面本身只要 0.2 秒。

  所以这里改成 route 型：这张由 Hana 伺服的小页面负责握手（瞬间完成），它再把真正的
  magpie 界面放进一个 iframe。内嵌 127.0.0.1 的权限在 manifest 的 ui.csp.frameDomains
  里声明（CSP 里 http://127.0.0.1 不带端口即匹配任意端口），代理端口是每次启动随机挑的，
  所以只能这样声明。

  壳子还兼一个桥：主题选择的持久化要落到 App 的路由（ui.json 的唯一写入方），那个地址
  和 iframe 不同源，所以由这里代转。
-->
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; }
  #frame { border: 0; width: 100%; height: 100%; display: block; }
  #msg { color: #8b98a5; font: 13px/1.7 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 18px; }
  #msg b { color: #c9d4e0; font-weight: 600; }
</style>
</head>
<body>
<div id="msg"><b>正在连接 magpie…</b></div>
<iframe id="frame" style="display:none" allow="clipboard-read; clipboard-write"></iframe>
<script>
(function () {
  var T0 = Date.now();          // 壳子脚本开始执行：近似「宿主决定加载这张卡片」
  var ABS = "/api/apps/magpie-hana/routes/magpie-hana";
  var frame = document.getElementById("frame");
  var msg = document.getElementById("msg");
  var tries = 0;

  function show(text) {
    msg.innerHTML = text;
    msg.style.display = "block";
    frame.style.display = "none";
  }

  function connect() {
    tries += 1;
    readStatus()
      .then(function (j) {
        var port = j && (j.proxyPort || (j.live && j.live.proxyPort));
        if (!port) {
          show("<b>magpie 还没就绪</b><br>当前状态：" + ((j && j.phase) || "未知") + "<br>应答：" + JSON.stringify(j).slice(0, 220) + "<br>稍后自动重试…");
          setTimeout(connect, 1200);
          return;
        }
        frame.src = "http://127.0.0.1:" + port + "/";
        frame.style.display = "block";
        msg.style.display = "none";
        postTiming("src-set");
        // 反复打几声招呼：iframe 里的脚本可能比我们晚一步就绪，
        // 收到之后它才会把主题选择的持久化交给这里代转。
        announceShell();
      })
      .catch(function (e) {
        show("<b>读不到代理端口</b><br>" + String((e && e.message) || e) + "<br>" + scene() + "<br>稍后自动重试…");
        setTimeout(connect, Math.min(1500 * tries, 6000));
      });
  }

  // 读 App 路由的 /status。为什么不能裸 fetch：路由端要求凭据，裸 fetch 带不上，
  // 会静默 403（设置页那边踩过同样的坑）。而 route 卡片文档里并没有注入 Hana SDK
  // （实测 window.hana 不存在），所以凭据得自己找：服务卡片的做法是从卡片 URL 的
  // 查询串里取 appSurfaceSession，再用 X-Hana-App-Surface-Session 头带上。
  // 这里做成阶梯：SDK → 带凭据头的请求 → 裸请求 → 把现场细节显示出来。
  function sessionFromUrl() {
    var keys = ["appSurfaceSession", "surfaceSession", "hanaSession", "session", "ticket"];
    for (var i = 0; i < keys.length; i++) {
      try {
        var v = new URLSearchParams(location.search || "").get(keys[i]);
        if (v && v.length >= 8) return { key: keys[i], value: v };
      } catch (_) {}
    }
    return null;
  }

  function readStatus() {
    var sdk = window.hana && window.hana.api && window.hana.api.fetch;
    if (sdk) {
      return Promise.resolve(window.hana.api.fetch("/magpie-hana/status")).then(function (r) { return r.json(); });
    }
    var s = sessionFromUrl();
    function attempt(withSession) {
      var headers = withSession ? { "X-Hana-App-Surface-Session": s.value } : {};
      return fetch(ABS + "/status", { credentials: "same-origin", headers: headers }).then(function (r) {
        if (r.ok) return r.json();
        var err = new Error("HTTP " + r.status + (withSession ? "（已带上 " + s.key + "）" : "（没找到凭据参数）"));
        err.status = r.status;
        throw err;
      });
    }
    if (s) return attempt(true).catch(function () { return attempt(false); });
    return attempt(false);
  }

  // 失败现场：不猜，直接告诉上游到底有什么。
  function scene() {
    var globals = [];
    try {
      globals = Object.keys(window).filter(function (k) { return /hana|sdk|app|surface|card/i.test(k); }).slice(0, 12);
    } catch (_) {}
    return "查询串：" + String(location.search || "（空）").slice(0, 160) +
      "<br>候选全局：" + (globals.length ? globals.join(", ") : "（无）");
  }

  function postTiming(phase) {
    var globals = [];
    try {
      globals = Object.keys(window).filter(function (k) { return /hana|sdk|surface|card/i.test(k); }).slice(0, 8);
    } catch (_) {}
    try {
      frame.contentWindow.postMessage({
        type: "magpie-hana:timing", phase: phase, t0: T0, t1: Date.now(),
        sdk: !!(window.hana && window.hana.api && window.hana.api.fetch),
        q: String(location.search || "").slice(0, 120),
        globals: globals
      }, "*");
    } catch (_) {}
  }

  function announceShell() {
    [80, 400, 1200, 2500, 5000].forEach(function (d) {
      setTimeout(function () {
        try { frame.contentWindow.postMessage({ type: "magpie-hana:shell" }, "*"); } catch (_) {}
        postTiming("shell-ping");
      }, d);
    });
  }

  // 主题选择的持久化：iframe 里的页面把选择发过来，这里落到 App 路由。
  frame.addEventListener("load", function () { postTiming("frame-loaded"); });  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.type !== "magpie-hana:choice") return;
    fetch(ABS + "/theme", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ theme: d.theme })
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (j) {
        try { frame.contentWindow.postMessage({ type: "magpie-hana:choice-result", ok: true, data: j }, "*"); } catch (_) {}
      })
      .catch(function (err) {
        try { frame.contentWindow.postMessage({ type: "magpie-hana:choice-result", ok: false, error: String((err && err.message) || err) }, "*"); } catch (_) {}
      });
  });

  connect();
})();
</script>
</body>
</html>
